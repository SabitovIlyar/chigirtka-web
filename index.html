<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Веб-версия для друзей с iPhone (юзер 20.11). Телефон — игра на весь экран; компьютер — вертикальная полоса по центру. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chigirtka">
  <meta name="theme-color" content="#1c2412">
  <title>Chigirtka bosqini</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1c2412; overflow: hidden;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3ead2; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #3b4a22; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #1c2412; z-index: 2; transition: opacity .4s; }
    #loading .title { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
    #loading .bar { width: 220px; height: 10px; border-radius: 5px; background: #3b4a22; overflow: hidden; }
    #loading .fill { width: 0; height: 100%; background: #e8b84a; transition: width .2s; }
    #loading .msg { font-size: 15px; opacity: .8; text-align: center; padding: 0 24px; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
      background: #1c2412; z-index: 3; font-size: 20px; padding: 24px; }
    @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <div class="title">Chigirtka bosqini</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="msg" id="msg">Загрузка…</div>
  </div>
  <div id="rotate">Поверните телефон вертикально</div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var phone = window.matchMedia("(pointer: coarse)").matches;

    // Телефон — весь экран. Компьютер (или широкое окно) — вертикальная полоса 9:19,5, как экран телефона.
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = w;
      if (!phone || w > h * 0.62) cw = Math.min(w, Math.round(h * 9 / 19.5));
      canvas.style.width = cw + "px";
      canvas.style.height = h + "px";
    }
    window.addEventListener("resize", fit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
    fit();

    // iPhone: не даём странице прокручиваться и масштабироваться от жестов.
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webbuild.data.unityweb",
      frameworkUrl: buildUrl + "/webbuild.framework.js.unityweb",
      codeUrl: buildUrl + "/webbuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Chigirtka",
      productName: "Chigirtka bosqini",
      productVersion: "0.1b web 23.11 20:06",
      // Чёткость ×2 максимум: на iPhone ×3 видеокарте тяжело, а разницы глазом почти нет.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    var fill = document.getElementById("fill"), msg = document.getElementById("msg");
    var script = document.createElement("script");
    script.src = buildUrl + "/webbuild.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
      }).then(function () {
        var l = document.getElementById("loading");
        l.style.opacity = "0";
        setTimeout(function () { l.remove(); }, 450);
      }).catch(function (e) {
        msg.textContent = "Не получилось запустить игру: " + e;
      });
    };
    script.onerror = function () { msg.textContent = "Не загрузилось. Проверьте интернет и обновите страницу."; };
    document.body.appendChild(script);
  </script>
</body>
</html>
